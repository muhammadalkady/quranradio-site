  <!-- Apply the saved theme before paint (no flash) -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        d.classList.add('js');
        var p = localStorage.getItem('qr-theme') || 'system';
        if (p === 'light' || p === 'dark') d.dataset.theme = p;
        var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0E1512' : '#EAF3EC');
      } catch (e) { d.classList.add('js'); }
    })();
  </script>

  <!-- Preload the above-the-fold fonts so headings paint in them -->
{{preload}}

  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/assets/theme.js"></script>
