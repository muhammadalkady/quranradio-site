<!DOCTYPE html>
<!-- Generated by scripts/build.py from src/privacy.html and privacy/{{lang}}.html. Edit those, not this file. -->
<html lang="{{lang}}" dir="{{dir}}" data-script="{{script}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- A policy opened from the language menu (?lang=xx) records that language as the visitor's
       choice. The policy never redirects: the store links its English address. -->
  <script>
    (function () {
      var langs = {{langsJson}};
      try {
        var asked = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
        if (asked && langs.indexOf(asked) >= 0) {
          localStorage.setItem('qr-lang', asked);
          history.replaceState(null, '', location.pathname + location.hash);
        }
      } catch (e) {}
    })();
  </script>
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}" />
  <meta name="theme-color" content="#EAF3EC" />
  <meta name="author" content="Muhammad Alkady" />
  <meta name="application-name" content="{{name}}" />
  <link rel="canonical" href="{{url}}" />
{{hreflang}}

  <!-- Icons & manifest -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph -->
  <meta property="og:title" content="{{pageTitle}}" />
  <meta property="og:description" content="{{pageDescription}}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{url}}" />
  <meta property="og:site_name" content="{{name}}" />
  <meta property="og:locale" content="{{ogLocale}}" />
  <meta property="og:image" content="https://quranradio.app/icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{pageTitle}}" />
  <meta name="twitter:description" content="{{pageDescription}}" />
  <meta name="twitter:image" content="https://quranradio.app/icon-512.png" />

{{> head}}
</head>
<body>
  <a class="skip-link" href="#main">{{skip}}</a>

{{> nav}}

  <main class="policy" id="main">
    <section lang="{{lang}}" dir="{{dir}}">
{{policy}}
    </section>
  </main>

{{> footer}}
</body>
</html>
